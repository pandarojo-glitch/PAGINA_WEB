<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Reto final AR | Hiro y Kanji</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>body{margin:0;overflow:hidden;font-family:Arial,sans-serif}#info{position:fixed;top:12px;left:12px;right:12px;z-index:10;color:white;background:rgba(15,17,32,.76);padding:12px;border-radius:10px;text-align:center;font-size:14px;pointer-events:none}#controls{position:fixed;bottom:18px;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:10px}button{border:0;border-radius:9px;padding:12px;background:#292c4b;color:white;font-weight:bold}</style>
</head>
<body>
  <div id="info">RETO FINAL — VISTA FRONTAL<br>Hiro: Kumarine | Kanji: Tesoro</div>
  <div id="controls"><button id="lights">Luces: ON</button><button id="texture">Textura: ON</button></div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false">
    <a-assets><img id="kumarine" src="Kumarine.jpg" crossorigin="anonymous"></a-assets>
    <a-marker preset="hiro" emitevents="true" id="hiro">
      <a-entity id="gallery" position="0 0 0" rotation="-90 0 0" scale="0.72 0.72 0.72">
        <a-light type="ambient" color="#9095b8" intensity="0.8"></a-light>
        <a-light id="pinkLight" type="point" color="#ff91a0" intensity="1.2" distance="3" position="-0.48 0.46 0.3"></a-light>
        <a-light id="blueLight" type="point" color="#6ea0ff" intensity="1.1" distance="3" position="0.48 0.36 -0.18"></a-light>
        <a-box position="0 0.025 0" width="1.3" height="0.05" depth="1.1" color="#464358" roughness="0.95"></a-box>
        <a-box position="0 0.415 -0.53" width="1.3" height="0.73" depth="0.032" color="#31344e"></a-box>
        <a-box position="-0.64 0.415 0" width="0.032" height="0.73" depth="1.08" color="#303045"></a-box>
        <a-circle position="0 0.053 0" rotation="-90 0 0" radius="0.26" color="#080911" opacity="0.55" material="transparent:true;depthWrite:false"></a-circle>
        <a-box position="0 0.13 0" width="0.46" height="0.13" depth="0.38" color="#705a71" metalness="0.15" roughness="0.45"></a-box>
        <a-box position="0 0.426 0" width="0.408" height="0.468" depth="0.028" color="#563746"></a-box>
        <a-plane id="portrait" rotation="90 0 0" position="0 0.426 0.016" width="0.376" height="0.436" material="src:#kumarine;side:double;transparent:false"></a-plane>
        <a-plane id="fallback" rotation="90 0 0" position="0 0.426 0.017" width="0.376" height="0.436" color="#be5f7d" visible="false"></a-plane>
        <a-sphere position="-0.44 0.145 0.22" radius="0.096" color="#e18c91" metalness="0.25" roughness="0.25"></a-sphere>
        <a-box position="0.46 0.16 0.18" width="0.18" height="0.18" depth="0.18" color="#5aafd2" metalness="0.12" roughness="0.7" animation="property:rotation;to:0 360 0;dur:6500;loop:true;easing:linear"></a-box>
        <a-sphere id="pinkDot" position="-0.48 0.46 0.3" radius="0.02" color="#ff6473" material="shader:flat"></a-sphere>
        <a-sphere id="blueDot" position="0.48 0.36 -0.18" radius="0.02" color="#6496ff" material="shader:flat"></a-sphere>
        <a-text value="GALERIA KUMARINE" rotation="90 0 0" position="0 0.84 -0.5" align="center" width="1.5" color="#ffffff" side="double"></a-text>
      </a-entity>
    </a-marker>
    <a-marker preset="kanji" emitevents="true" id="kanji">
      <a-entity rotation="-90 0 0" scale="0.72 0.72 0.72">
        <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
        <a-light type="directional" color="#fff1b8" intensity="1.3" position="-1 3 2"></a-light>
        <a-box position="0 -0.08 0" width="1.8" height="0.15" depth="1.5" color="#555555"></a-box>
        <a-box position="0 0.01 0" width="1.75" height="0.04" depth="1.45" color="#468b42"></a-box>
        <a-entity position="0 0.12 0">
          <a-box position="0 0.20 0" width="0.85" height="0.40" depth="0.55" color="#75421f"></a-box>
          <a-box position="0 0.46 0" width="0.90" height="0.16" depth="0.60" color="#a66a32"></a-box>
          <a-box position="-0.30 0.30 0" width="0.09" height="0.50" depth="0.62" color="#d4af37"></a-box>
          <a-box position="0.30 0.30 0" width="0.09" height="0.50" depth="0.62" color="#d4af37"></a-box>
          <a-box position="0 0.31 0.32" width="0.20" height="0.22" depth="0.05" color="#ffd700"></a-box>
          <a-box position="0 0.31 0.35" width="0.06" height="0.10" depth="0.02" color="#333333"></a-box>
        </a-entity>
        <a-cylinder position="-0.57 0.10 0.42" radius="0.13" height="0.06" color="#ffd700"></a-cylinder>
        <a-cylinder position="-0.57 0.17 0.42" radius="0.13" height="0.06" color="#ffc400"></a-cylinder>
        <a-cylinder position="0.55 0.10 0.35" radius="0.13" height="0.06" color="#ffd700"></a-cylinder>
        <a-cylinder position="0.55 0.17 0.35" radius="0.13" height="0.06" color="#ffc400"></a-cylinder>
        <a-cylinder position="0.55 0.24 0.35" radius="0.13" height="0.06" color="#ffd700"></a-cylinder>
        <a-entity position="0 1.15 0" animation="property:position;from:0 1.10 0;to:0 1.30 0;dir:alternate;dur:1500;loop:true;easing:easeInOutSine">
          <a-entity animation="property:rotation;to:0 360 0;dur:4500;loop:true;easing:linear">
            <a-box position="0 0.25 0" width="0.12" height="0.55" depth="0.04" color="#bdefff" metalness="0.7" roughness="0.2"></a-box>
            <a-cone position="0 0.57 0" radius-bottom="0.085" radius-top="0" height="0.18" segments-radial="4" color="#e0ffff"></a-cone>
            <a-box position="0 -0.06 0" width="0.38" height="0.09" depth="0.10" color="#ffd700"></a-box>
            <a-cylinder position="0 -0.23 0" radius="0.045" height="0.28" color="#503018"></a-cylinder>
            <a-sphere position="0 -0.39 0" radius="0.075" color="#ffd700"></a-sphere>
          </a-entity>
        </a-entity>
        <a-octahedron position="-0.67 0.25 -0.35" radius="0.16" color="#00e5ff" animation="property:rotation;to:0 360 0;dur:3500;loop:true;easing:linear"></a-octahedron>
        <a-octahedron position="0.67 0.25 -0.35" radius="0.16" color="#ff1493" animation="property:rotation;to:0 360 0;dur:4000;loop:true;easing:linear"></a-octahedron>
        <a-text value="TESORO DESBLOQUEADO" rotation="90 0 0" align="center" color="#ffd700" position="0 1.95 0" width="3.5" side="double"></a-text>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    let lightsOn=true,textureOn=true;
    document.getElementById('lights').addEventListener('click',()=>{
      lightsOn=!lightsOn;
      ['pinkLight','blueLight','pinkDot','blueDot'].forEach(id=>document.getElementById(id).setAttribute('visible',lightsOn));
      document.getElementById('lights').textContent='Luces: '+(lightsOn?'ON':'OFF');
    });
    document.getElementById('texture').addEventListener('click',()=>{
      textureOn=!textureOn;
      document.getElementById('portrait').setAttribute('visible',textureOn);
      document.getElementById('fallback').setAttribute('visible',!textureOn);
      document.getElementById('texture').textContent='Textura: '+(textureOn?'ON':'OFF');
    });
    document.getElementById('hiro').addEventListener('markerFound',()=>{document.getElementById('info').textContent='¡Kumarine detectada! Mueve el celular alrededor del marcador';});
    document.getElementById('hiro').addEventListener('markerLost',()=>{document.getElementById('info').textContent='Apunta al marcador Hiro o Kanji';});
    document.getElementById('kanji').addEventListener('markerFound',()=>{document.getElementById('info').textContent='¡Tesoro detectado! Marcador Kanji';});
    document.getElementById('kanji').addEventListener('markerLost',()=>{document.getElementById('info').textContent='Apunta al marcador Hiro o Kanji';});
  </script>
</body>
</html>
