
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>Reto final AR | Hiro y Kanji</title>

  <!-- Librerías -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Orientación automática hacia la cámara -->
  <script>
    AFRAME.registerComponent('vista-frontal', {
      init: function () {
        this.rotacionCamara = new AFRAME.THREE.Quaternion();
        this.rotacionPadre = new AFRAME.THREE.Quaternion();
      },

      tick: function () {
        const camara = this.el.sceneEl.camera;
        const objeto = this.el.object3D;

        if (!camara || !objeto.parent) return;

        camara.getWorldQuaternion(this.rotacionCamara);
        objeto.parent.getWorldQuaternion(this.rotacionPadre);

        objeto.quaternion.copy(
          this.rotacionPadre.invert()
            .multiply(this.rotacionCamara)
        );
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      color: white;
      background: rgba(15,17,32,.85);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px;
      background: #292c4b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="info">
    RETO FINAL — VISTA FRONTAL
    <br>
    Hiro: Kumarine | Kanji: Tesoro
  </div>

  <div id="controls">
    <button id="lights">Luces: ON</button>
    <button id="texture">Textura: ON</button>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false">

    <!-- Recursos -->
    <a-assets>
      <img id="kumarine" src="Kumarine.jpg">
    </a-assets>

    <!-- Iluminación general -->
    <a-light
      type="ambient"
      color="#FFFFFF"
      intensity="0.8">
    </a-light>

    <a-light
      type="directional"
      color="#FFFFFF"
      intensity="0.8"
      position="1 3 4">
    </a-light>

    <!-- ================================= -->
    <!-- MARCADOR HIRO - GALERÍA KUMARINE   -->
    <!-- ================================= -->

    <a-marker
      preset="hiro"
      emitevents="true"
      id="hiro"
      smooth="true"
      smooth-count="5"
      smooth-tolerance="0.01"
      smooth-threshold="2">

      <a-entity
        id="gallery"
        vista-frontal
        position="0 0 0"
        scale="0.60 0.60 0.60">

        <!-- Luz rosa -->
        <a-light
          id="pinkLight"
          type="point"
          color="#ff91a0"
          intensity="1.2"
          distance="3"
          position="-0.48 0.46 0.3">
        </a-light>

        <!-- Luz azul -->
        <a-light
          id="blueLight"
          type="point"
          color="#6ea0ff"
          intensity="1.1"
          distance="3"
          position="0.48 0.36 -0.18">
        </a-light>

        <!-- Piso -->
        <a-box
          position="0 0.025 0"
          width="1.3"
          height="0.05"
          depth="1.1"
          color="#464358"
          roughness="0.95">
        </a-box>

        <!-- Pared trasera -->
        <a-box
          position="0 0.415 -0.53"
          width="1.3"
          height="0.73"
          depth="0.032"
          color="#31344e">
        </a-box>

        <!-- Pared izquierda -->
        <a-box
          position="-0.64 0.415 0"
          width="0.032"
          height="0.73"
          depth="1.08"
          color="#303045">
        </a-box>

        <!-- Sombra -->
        <a-circle
          position="0 0.053 0"
          rotation="-90 0 0"
          radius="0.26"
          color="#080911"
          opacity="0.55"
          material="transparent:true;depthWrite:false">
        </a-circle>

        <!-- Pedestal -->
        <a-box
          position="0 0.13 0"
          width="0.46"
          height="0.13"
          depth="0.38"
          color="#705a71"
          metalness="0.15"
          roughness="0.45">
        </a-box>

        <!-- Marco de la fotografía -->
        <a-box
          position="0 0.426 0"
          width="0.408"
          height="0.468"
          depth="0.028"
          color="#563746">
        </a-box>

        <!-- Fotografía corregida -->
        <a-plane
          id="portrait"
          rotation="0 0 0"
          position="0 0.426 0.018"
          width="0.376"
          height="0.436"
          material="src:#kumarine;
                    shader:flat;
                    side:double">
        </a-plane>

        <!-- Superficie sin textura -->
        <a-plane
          id="fallback"
          rotation="0 0 0"
          position="0 0.426 0.019"
          width="0.376"
          height="0.436"
          color="#be5f7d"
          visible="false">
        </a-plane>

        <!-- Esfera rosa -->
        <a-sphere
          position="-0.44 0.145 0.22"
          radius="0.096"
          color="#e18c91"
          metalness="0.25"
          roughness="0.25">
        </a-sphere>

        <!-- Cubo azul giratorio -->
        <a-box
          position="0.46 0.16 0.18"
          width="0.18"
          height="0.18"
          depth="0.18"
          color="#5aafd2"
          metalness="0.12"
          roughness="0.7"
          animation="property:rotation;
                     to:0 360 0;
                     dur:6500;
                     loop:true;
                     easing:linear">
        </a-box>

        <!-- Indicador de luz rosa -->
        <a-sphere
          id="pinkDot"
          position="-0.48 0.46 0.3"
          radius="0.02"
          color="#ff6473"
          material="shader:flat">
        </a-sphere>

        <!-- Indicador de luz azul -->
        <a-sphere
          id="blueDot"
          position="0.48 0.36 -0.18"
          radius="0.02"
          color="#6496ff"
          material="shader:flat">
        </a-sphere>

        <!-- Texto frontal -->
        <a-text
          value="GALERIA KUMARINE"
          rotation="0 0 0"
          position="0 0.90 0"
          align="center"
          width="1.8"
          color="#FFFFFF"
          side="double">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- ================================= -->
    <!-- MARCADOR KANJI - COFRE DEL TESORO  -->
    <!-- ================================= -->

    <a-marker
      preset="kanji"
      emitevents="true"
      id="kanji"
      smooth="true"
      smooth-count="5"
      smooth-tolerance="0.01"
      smooth-threshold="2">

      <a-entity
        id="treasure"
        vista-frontal
        position="0 0 0"
        scale="0.50 0.50 0.50">

        <!-- Plataforma de piedra -->
        <a-box
          position="0 -0.08 0"
          width="1.8"
          height="0.15"
          depth="1.5"
          color="#555555">
        </a-box>

        <!-- Superficie de césped -->
        <a-box
          position="0 0.01 0"
          width="1.75"
          height="0.04"
          depth="1.45"
          color="#468b42">
        </a-box>

        <!-- COFRE -->
        <a-entity position="0 0.12 0">

          <!-- Cuerpo -->
          <a-box
            position="0 0.20 0"
            width="0.85"
            height="0.40"
            depth="0.55"
            color="#75421f">
          </a-box>

          <!-- Tapa -->
          <a-box
            position="0 0.46 0"
            width="0.90"
            height="0.16"
            depth="0.60"
            color="#a66a32">
          </a-box>

          <!-- Banda izquierda -->
          <a-box
            position="-0.30 0.30 0"
            width="0.09"
            height="0.50"
            depth="0.62"
            color="#d4af37">
          </a-box>

          <!-- Banda derecha -->
          <a-box
            position="0.30 0.30 0"
            width="0.09"
            height="0.50"
            depth="0.62"
            color="#d4af37">
          </a-box>

          <!-- Cerradura -->
          <a-box
            position="0 0.31 0.32"
            width="0.20"
            height="0.22"
            depth="0.05"
            color="#ffd700">
          </a-box>

          <!-- Orificio de cerradura -->
          <a-box
            position="0 0.31 0.35"
            width="0.06"
            height="0.10"
            depth="0.02"
            color="#333333">
          </a-box>

        </a-entity>

        <!-- MONEDAS DE ORO -->

        <a-cylinder
          position="-0.57 0.10 0.42"
          radius="0.13"
          height="0.06"
          color="#ffd700">
        </a-cylinder>

        <a-cylinder
          position="-0.57 0.17 0.42"
          radius="0.13"
          height="0.06"
          color="#ffc400">
        </a-cylinder>

        <a-cylinder
          position="0.55 0.10 0.35"
          radius="0.13"
          height="0.06"
          color="#ffd700">
        </a-cylinder>

        <a-cylinder
          position="0.55 0.17 0.35"
          radius="0.13"
          height="0.06"
          color="#ffc400">
        </a-cylinder>

        <a-cylinder
          position="0.55 0.24 0.35"
          radius="0.13"
          height="0.06"
          color="#ffd700">
        </a-cylinder>

        <!-- ESPADA FLOTANTE -->

        <a-entity
          position="0 1.15 0"
          animation="property:position;
                     from:0 1.10 0;
                     to:0 1.30 0;
                     dir:alternate;
                     dur:1500;
                     loop:true;
                     easing:easeInOutSine">

          <a-entity
            animation="property:rotation;
                       to:0 360 0;
                       dur:4500;
                       loop:true;
                       easing:linear">

            <!-- Hoja -->
            <a-box
              position="0 0.25 0"
              width="0.12"
              height="0.55"
              depth="0.04"
              color="#bdefff"
              metalness="0.4"
              roughness="0.3">
            </a-box>

            <!-- Punta -->
            <a-cone
              position="0 0.57 0"
              radius-bottom="0.085"
              radius-top="0"
              height="0.18"
              segments-radial="4"
              color="#e0ffff">
            </a-cone>

            <!-- Guarda -->
            <a-box
              position="0 -0.06 0"
              width="0.38"
              height="0.09"
              depth="0.10"
              color="#ffd700">
            </a-box>

            <!-- Mango -->
            <a-cylinder
              position="0 -0.23 0"
              radius="0.045"
              height="0.28"
              color="#503018">
            </a-cylinder>

            <!-- Pomo -->
            <a-sphere
              position="0 -0.39 0"
              radius="0.075"
              color="#ffd700">
            </a-sphere>

          </a-entity>

        </a-entity>

        <!-- Gema azul -->
        <a-octahedron
          position="-0.67 0.25 -0.35"
          radius="0.16"
          color="#00e5ff"
          animation="property:rotation;
                     to:0 360 0;
                     dur:3500;
                     loop:true;
                     easing:linear">
        </a-octahedron>

        <!-- Gema rosa -->
        <a-octahedron
          position="0.67 0.25 -0.35"
          radius="0.16"
          color="#ff1493"
          animation="property:rotation;
                     to:0 360 0;
                     dur:4000;
                     loop:true;
                     easing:linear">
        </a-octahedron>

        <!-- Texto frontal -->
        <a-text
          value="TESORO DESBLOQUEADO"
          rotation="0 0 0"
          align="center"
          color="#ffd700"
          position="0 2.05 0"
          width="3.5"
          side="double">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- Cámara compartida -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- ================================= -->
  <!-- CONTROLES Y DETECCIÓN DE MARCADORES -->
  <!-- ================================= -->

  <script>

    let lightsOn = true;
    let textureOn = true;

    let hiroDetectado = false;
    let kanjiDetectado = false;

    const info = document.getElementById('info');

    // Activar y desactivar luces
    document.getElementById('lights')
      .addEventListener('click', () => {

        lightsOn = !lightsOn;

        document.getElementById('pinkLight')
          .setAttribute('light', 'intensity',
                        lightsOn ? 1.2 : 0);

        document.getElementById('blueLight')
          .setAttribute('light', 'intensity',
                        lightsOn ? 1.1 : 0);

        ['pinkDot', 'blueDot'].forEach(id => {
          document.getElementById(id)
            .setAttribute('visible', lightsOn);
        });

        document.getElementById('lights')
          .textContent = 'Luces: ' +
                         (lightsOn ? 'ON' : 'OFF');
      });

    // Activar y desactivar textura
    document.getElementById('texture')
      .addEventListener('click', () => {

        textureOn = !textureOn;

        document.getElementById('portrait')
          .setAttribute('visible', textureOn);

        document.getElementById('fallback')
          .setAttribute('visible', !textureOn);

        document.getElementById('texture')
          .textContent = 'Textura: ' +
                         (textureOn ? 'ON' : 'OFF');
      });

    // Actualizar estado de detección
    function actualizarMensaje() {

      if (hiroDetectado && kanjiDetectado) {

        info.textContent =
          '¡AMBOS MARCADORES DETECTADOS!';

      } else if (hiroDetectado) {

        info.textContent =
          'HIRO DETECTADO | Galería Kumarine';

      } else if (kanjiDetectado) {

        info.textContent =
          'KANJI DETECTADO | Tesoro desbloqueado';

      } else {

        info.textContent =
          'Apunta la cámara a Hiro o Kanji';
      }
    }

    // Detección de Hiro
    document.getElementById('hiro')
      .addEventListener('markerFound', () => {

        hiroDetectado = true;
        actualizarMensaje();
      });

    document.getElementById('hiro')
      .addEventListener('markerLost', () => {

        hiroDetectado = false;
        actualizarMensaje();
      });

    // Detección de Kanji
    document.getElementById('kanji')
      .addEventListener('markerFound', () => {

        kanjiDetectado = true;
        actualizarMensaje();
      });

    document.getElementById('kanji')
      .addEventListener('markerLost', () => {

        kanjiDetectado = false;
        actualizarMensaje();
      });

    actualizarMensaje();

  </script>

</body>
</html>
