
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Práctica 2 - Tesoro AR Kanji</title>

  <!-- Motor 3D -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Realidad aumentada -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .titulo {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
      width: 80%;
      max-width: 360px;
      pointer-events: none;
    }

    .titulo h2 {
      margin: 0;
      color: #FFD700;
      font-size: 18px;
    }

    .titulo p {
      margin: 5px 0 0;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="titulo">
    <h2>TESORO DESBLOQUEADO</h2>
    <p>Apunta tu cámara al marcador Kanji</p>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Iluminación -->
    <a-entity light="type: ambient;
                     color: #FFFFFF;
                     intensity: 1.1">
    </a-entity>

    <a-entity light="type: directional;
                     color: #FFF1B8;
                     intensity: 1.5"
              position="-1 3 2">
    </a-entity>

    <!-- Marcador KANJI -->
    <a-marker preset="kanji"
              emitevents="true">

      <!-- Escenario completo -->
      <a-entity scale="0.75 0.75 0.75">

        <!-- Plataforma de piedra -->
        <a-box
          position="0 -0.08 0"
          width="1.8"
          height="0.15"
          depth="1.5"
          color="#555555">
        </a-box>

        <!-- Superficie verde -->
        <a-box
          position="0 0.01 0"
          width="1.75"
          height="0.04"
          depth="1.45"
          color="#468B42">
        </a-box>

        <!-- COFRE DEL TESORO -->

        <a-entity position="0 0.12 0">

          <!-- Cuerpo -->
          <a-box
            position="0 0.20 0"
            width="0.85"
            height="0.40"
            depth="0.55"
            color="#75421F">
          </a-box>

          <!-- Tapa -->
          <a-box
            position="0 0.46 0"
            width="0.90"
            height="0.16"
            depth="0.60"
            color="#A66A32">
          </a-box>

          <!-- Bandas metálicas -->
          <a-box
            position="-0.30 0.30 0"
            width="0.09"
            height="0.50"
            depth="0.62"
            color="#D4AF37">
          </a-box>

          <a-box
            position="0.30 0.30 0"
            width="0.09"
            height="0.50"
            depth="0.62"
            color="#D4AF37">
          </a-box>

          <!-- Cerradura -->
          <a-box
            position="0 0.31 0.32"
            width="0.20"
            height="0.22"
            depth="0.05"
            color="#FFD700">
          </a-box>

          <a-box
            position="0 0.31 0.35"
            width="0.06"
            height="0.10"
            depth="0.02"
            color="#333333">
          </a-box>

        </a-entity>

        <!-- MONEDAS DE ORO -->

        <a-cylinder
          position="-0.57 0.10 0.42"
          radius="0.13"
          height="0.06"
          color="#FFD700">
        </a-cylinder>

        <a-cylinder
          position="-0.57 0.17 0.42"
          radius="0.13"
          height="0.06"
          color="#FFC400">
        </a-cylinder>

        <a-cylinder
          position="0.55 0.10 0.35"
          radius="0.13"
          height="0.06"
          color="#FFD700">
        </a-cylinder>

        <a-cylinder
          position="0.55 0.17 0.35"
          radius="0.13"
          height="0.06"
          color="#FFC400">
        </a-cylinder>

        <a-cylinder
          position="0.55 0.24 0.35"
          radius="0.13"
          height="0.06"
          color="#FFD700">
        </a-cylinder>

        <!-- ESPADA FLOTANTE -->

        <a-entity
          position="0 1.15 0"
          animation="property: rotation;
                     to: 0 360 0;
                     dur: 4500;
                     loop: true;
                     easing: linear">

          <!-- Hoja -->
          <a-box
            position="0 0.25 0"
            width="0.12"
            height="0.55"
            depth="0.04"
            color="#BDEFFF"
            metalness="0.7"
            roughness="0.2">
          </a-box>

          <!-- Punta -->
          <a-cone
            position="0 0.57 0"
            radius-bottom="0.085"
            radius-top="0"
            height="0.18"
            segments-radial="4"
            color="#E0FFFF">
          </a-cone>

          <!-- Guarda -->
          <a-box
            position="0 -0.06 0"
            width="0.38"
            height="0.09"
            depth="0.10"
            color="#FFD700">
          </a-box>

          <!-- Mango -->
          <a-cylinder
            position="0 -0.23 0"
            radius="0.045"
            height="0.28"
            color="#503018">
          </a-cylinder>

          <!-- Pomo -->
          <a-sphere
            position="0 -0.39 0"
            radius="0.075"
            color="#FFD700">
          </a-sphere>

          <!-- Movimiento vertical -->
          <a-animation
            attribute="position"
            from="0 1.10 0"
            to="0 1.30 0"
            direction="alternate"
            dur="1500"
            repeat="indefinite">
          </a-animation>

        </a-entity>

        <!-- Gemas -->

        <a-octahedron
          position="-0.67 0.25 -0.35"
          radius="0.16"
          color="#00E5FF"
          animation="property: rotation;
                     to: 0 360 0;
                     dur: 3500;
                     loop: true;
                     easing: linear">
        </a-octahedron>

        <a-octahedron
          position="0.67 0.25 -0.35"
          radius="0.16"
          color="#FF1493"
          animation="property: rotation;
                     to: 0 360 0;
                     dur: 4000;
                     loop: true;
                     easing: linear">
        </a-octahedron>

        <!-- Texto flotante -->
        <a-text
          value="TESORO DESBLOQUEADO"
          align="center"
          color="#FFD700"
          position="0 1.95 0"
          width="3.5"
          side="double">
        </a-text>

      </a-entity>

    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
